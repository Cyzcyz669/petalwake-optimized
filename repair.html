<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Petalwake 修复</title><style>body{background:#0b1420;color:#fff6ee;font:17px/1.7 system-ui,sans-serif;margin:0;padding:12vh 7vw}main{max-width:34rem;margin:auto}a,button{display:inline-block;background:#ffd9e6;color:#251329;padding:12px 22px;border:0;border-radius:28px;font:inherit;text-decoration:none}small{opacity:.75}[hidden]{display:none!important}</style></head><body><main><h1>Petalwake 加载修复</h1><p id="status">正在清理旧版游戏缓存……</p><a id="open" href="./" hidden>重新打开游戏</a><p><small>只清理本游戏的旧缓存，不会删除游戏记录。首次加载仍需要网络。</small></p></main><script>
(async()=>{try{if('serviceWorker' in navigator){const scope=new URL('./',location.href).href;const reg=await navigator.serviceWorker.getRegistration(scope);if(reg&&reg.scope===scope)await reg.unregister()}if('caches' in window)for(const key of await caches.keys())if(key.startsWith('petalwake-'))await caches.delete(key);document.getElementById('status').textContent='清理完成。请点击下方按钮重新打开游戏。';document.getElementById('open').hidden=false}catch(e){document.getElementById('status').textContent='清理未完成。请检查网络后重新打开此页面。'}})();
</script></body></html>
